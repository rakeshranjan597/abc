name: Auto-Approve on Success
on:
  pull_request:
    branches:
      - master

jobs:
  approve-and-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      checks: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. WAIT for all other CI checks to finish successfully
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. APPROVE with a custom comment
      - name: Approve PR
        if: success()
        run: |
          gh pr review "$PR_URL" --approve --body "✅ All checks passed successfully! Automated approval granted."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
