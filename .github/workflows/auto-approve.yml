name: Auto Approve Master Pr
on:
  pull_request:
    types:
      - opened                  # PR created
      - synchronize             # New commits pushed to the PR
      - reopened                # Closed PR is opened again
      - ready_for_review        # Converted from Draft to Ready
      - assigned                # User assigned
      - unassigned              # User removed
      - review_requested        # Reviewer added
      - edited                  # Title or body changed
      - review_request_removed
    branches:
      - master

jobs:
  approve_pr_and_comment:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'master'
    permissions:
      pull-requests: write
      contents: write
      checks: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Approve PR And Comment
        if: success()
        run: |
          gh pr review "$PR_URL" --approve --body "✅ All checks passed successfully! Automated approval granted."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
