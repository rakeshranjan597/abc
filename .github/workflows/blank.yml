name: Auto-Approve Master PRs
on:
  pull_request:
    types: [opened, reopened, synchronized]
    branches: [master]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve PR
        uses: actions/checkout@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
